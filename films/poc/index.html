<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>POC — one object, one tween</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0f14;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #box {
        position: absolute;
        top: calc(50% - 120px);
        left: calc(50% - 120px);
        width: 240px;
        height: 240px;
        border-radius: 32px;
        background: #f4f4f5;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-x3dq" id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div data-hf-id="hf-sm3j" id="box" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#box",
        { x: -600, opacity: 0 },
        { x: 600, opacity: 1, duration: 3, ease: "power2.inOut" },
        0.5,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
