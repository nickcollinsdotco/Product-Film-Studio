<!DOCTYPE html>
<!--
  Quick Loop composition: one Screen image on a Backdrop, scrolled and
  optionally zoomed into one focus area, optionally opening on the page
  being drawn (the build intro: transitions.dev's UI generation over the
  captured page's layout map). Every frame is a closed-form function of
  time (hf-seek), so preview and render match.
  server.mjs bakes size, duration, image and config in for renders;
  the app page calls window.quick.apply(cfg) / window.quick.seek(t) for preview.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=__W__, height=__H__">
    <title>Quick Loop</title>
    <style>
      html, body { margin: 0; overflow: hidden; background: #000; }
      #root { position: relative; overflow: hidden; }
      /* Not hit-tested: the build intro's agent texts only go where the frame reads as empty */
      #backdrop { position: absolute; inset: 0; pointer-events: none; }
      #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      /* The tilted layer keeps a transparent margin round the Screen so its
         edges are filtered inside the texture, not cut aliased at the layer's edge. */
      #card { position: absolute; padding: 2px; transform-origin: 50% 50%; }
      /* No background: one would leak through the anti-aliased rounded corners as a light fringe. */
      #face { position: relative; overflow: hidden; }
      #bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; }
      #bar i { display: block; border-radius: 50%; }
      #viewport { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; }
      #shot { position: absolute; left: 0; top: 0; display: block; }
      #dither { position: absolute; inset: 0; pointer-events: none; }
      /* Build intro: the step dot's pulse is driven by the clock, not a CSS animation */
      .t-gen-step i { animation: none !important; }
    </style>
    <!--__UIGEN__-->
  </head>
  <body>
    <div id="root" data-composition-id="quick-loop" data-no-timeline="" data-start="0" data-duration="__D__" data-fps="60" data-width="__W__" data-height="__H__">
      <div id="backdrop"></div>
      <div id="stage">
        <div id="card">
          <div id="face">
            <div id="bar"><i></i><i></i><i></i></div>
            <div id="viewport"><img id="shot" src="__SRC__" alt=""></div>
          </div>
        </div>
      </div>
      <canvas id="dither"></canvas>
    </div>
    <script>/*__CONFIG__*/</script>
    <script>
      (() => {
        const DEFAULTS = {
          width: 1920, height: 1080, duration: 8,
          bg: "#0e1116", backdrop: "glow",
          image: null,            // { url, w, h }
          screenWidth: 0.72,      // card width as a fraction of frame width
          viewport: "16:10",      // card aspect: "16:10" | "4:3" | "9:19.5" | "fill"
          frame: "browser",       // "browser" | "none"
          radius: 14, shadow: true, tilt: 8,
          focus: null,            // { x, y, w, h } as fractions of the image
          focusMove: "end",       // "end" scroll then zoom in | "start" open zoomed, pull out, scroll | "inout" zoom in, out, scroll | "scroll" no zoom
          scrollLimit: 1,         // where the bottom of the last view stops, as a fraction of the image height
          loopBack: false,
          intro: "none",          // build intro: "none" | "skeleton" | "skeleton-texts" (needs a layout map)
          layout: null,           // the captured page's layout map: { width, height, title, code, parts }
        };
        const BUILD_MS = 2400;    // the runtime's drawing time (its default); the build runs about 1.09x this
        const SETTLE = 0.8;       // s for the card to ease from its flat build pose into the first Shot
        const $ = (id) => document.getElementById(id);
        let cfg = { ...DEFAULTS }, geo = null, time = 0, gen = null;
        // seconds of build at the start; 0 without one
        const introLength = () => (cfg.intro !== "none" && cfg.layout && window.UIGeneration ? Math.round(BUILD_MS * 1.09 + 150) / 1000 : 0);

        const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
        const lerp = (a, b, k) => a + (b - a) * k;
        const lum = (hex) => {
          const n = parseInt(hex.replace("#", ""), 16);
          return (0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255;
        };
        const shade = (hex, amt) => {
          const n = parseInt(hex.replace("#", ""), 16);
          const f = (c) => Math.round(Math.min(255, Math.max(0, c + (amt > 0 ? (255 - c) : c) * amt)));
          return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
        };

        function layout() {
          const { width: W, height: H } = cfg;
          const img = cfg.image || { w: 1440, h: 4000 };
          const aspect = { "16:10": 16 / 10, "4:3": 4 / 3, "9:19.5": 9 / 19.5 }[cfg.viewport];
          let cw = W * cfg.screenWidth;
          const barH = (w) => (cfg.frame === "browser" ? Math.round(Math.max(24, w * 0.026)) : 0);
          const maxH = H * 0.84;
          let vh = aspect ? cw / aspect : maxH - barH(cw);
          if (vh + barH(cw) > maxH) { // too tall for the frame: shrink width to fit
            const k = maxH / (vh + barH(cw)); cw *= k; vh = aspect ? cw / aspect : maxH - barH(cw);
          }
          const bh = barH(cw), ch = vh + bh;
          const s = cw / img.w, ih = img.h * s;
          const maxScroll = Math.max(0, ih - vh);
          const left = (W - cw) / 2, top = (H - ch) / 2;

          const limit = Math.min(maxScroll, Math.max(0, cfg.scrollLimit * ih - vh));
          let fs = 0, zoomTo = null; // fs: scroll that centres the focus area
          if (cfg.focus) {
            const f = cfg.focus;
            const fy = (f.y + f.h / 2) * ih;
            fs = Math.min(maxScroll, Math.max(0, fy - vh / 2));
            if (cfg.focusMove !== "scroll") {
              const fw = f.w * cw, fh = Math.min(f.h * ih, vh);
              const Z = Math.min(2.5, Math.max(1, Math.min((W * 0.72) / fw, (H * 0.72) / fh)));
              const cx = left + (f.x + f.w / 2) * cw;
              const cy = top + bh + Math.min(vh, Math.max(0, fy - fs));
              zoomTo = { Z, cx, cy };
            }
          }

          // Keyframes: [time fraction, scroll px, zoom 0..1, tilt 0..1]
          const T = cfg.tilt ? 1 : 0, rest = 0.35 * T;
          const end = Math.max(fs, limit); // after a focus at the start, keep scrolling down to the limit
          const move = zoomTo ? cfg.focusMove : "none";
          let keys = {
            none: [[0, 0, 0, T], [0.12, 0, 0, T], [0.85, cfg.focus ? fs : limit, 0, rest], [1, cfg.focus ? fs : limit, 0, rest]],
            end: [[0, 0, 0, T], [0.12, 0, 0, T], [0.55, fs, 0, 0.5 * T], [0.78, fs, 1, 0], [1, fs, 1, 0]],
            start: [[0, fs, 1, 0], [0.15, fs, 1, 0], [0.38, fs, 0, 0.6 * T], [0.88, end, 0, rest], [1, end, 0, rest]],
            inout: [[0, fs, 0, T], [0.08, fs, 0, T], [0.28, fs, 1, 0], [0.42, fs, 1, 0], [0.58, fs, 0, 0.6 * T], [0.9, end, 0, rest], [1, end, 0, rest]],
          }[move];
          if (cfg.loopBack) { // forward in the first ~55%, hold, return, end on frame 0's state
            const fwd = keys.map(([t, ...v]) => [t * 0.55, ...v]);
            const last = fwd[fwd.length - 1], first = fwd[0];
            keys = [...fwd, [0.68, ...last.slice(1)], [0.94, ...first.slice(1)], [1, ...first.slice(1)]];
          }
          geo = { W, H, cw, ch, vh, bh, left, top, ih, zoomTo, keys };
        }

        // The build holds the card flat and still (the drawing is pinned to the layout), then eases into the Shot.
        function stateAt(t) {
          const I = introLength();
          if (!I) return shotAt(t);
          if (t < I) return { scroll: 0, zoom: 0, tilt: 0 };
          const st = shotAt(t - I), u = ease(Math.min(1, (t - I) / SETTLE));
          return { scroll: lerp(0, st.scroll, u), zoom: lerp(0, st.zoom, u), tilt: lerp(0, st.tilt, u) };
        }

        function shotAt(t) {
          const k = Math.min(1, Math.max(0, t / cfg.duration)), keys = geo.keys;
          let i = 0;
          while (i < keys.length - 2 && k > keys[i + 1][0]) i++;
          const a = keys[i], b = keys[i + 1];
          const u = b[0] > a[0] ? ease(Math.min(1, Math.max(0, (k - a[0]) / (b[0] - a[0])))) : 1;
          return { scroll: lerp(a[1], b[1], u), zoom: lerp(a[2], b[2], u), tilt: lerp(a[3], b[3], u) };
        }

        // Fixed, seeded noise of about +-2 levels over the frame: breaks up the
        // 8-bit steps in dark shadows and glows that the encoder turns into bands.
        function dither(W, H) {
          const c = $("dither");
          if (c.width === W && c.height === H) return;
          c.width = W; c.height = H;
          const ctx = c.getContext("2d"), img = ctx.createImageData(W, H), d = img.data;
          let seed = 1;
          for (let i = 0; i < d.length; i += 4) {
            seed = (seed * 1664525 + 1013904223) >>> 0;
            const v = seed >>> 24;
            d[i] = d[i + 1] = d[i + 2] = v & 1 ? 255 : 0; // white lifts, black lowers
            d[i + 3] = (v >> 1) % 10;                   // alpha 0..9 of 255
          }
          ctx.putImageData(img, 0, 0);
        }

        // Layered: a tight contact shadow plus progressively wider, fainter ones, so the
        // falloff is gradual instead of one dense slab (which reads as a block on dark backdrops).
        function shadow(w, dark, fade = 1) {
          const k = (dark ? 1 : 0.45) * fade;
          const layers = [[0.002, 0.006, 0.28], [0.008, 0.02, 0.2], [0.02, 0.05, 0.16], [0.045, 0.12, 0.12]]
            .map(([y, b, a]) => `0 ${w * y}px ${w * b}px rgba(0,0,0,${a * k})`);
          return [...layers, `0 0 0 1px rgba(${dark ? "255,255,255,0.06" : "0,0,0,0.06"})`].join(", ");
        }

        function paint() {
          const { W, H } = geo;
          dither(W, H);
          Object.assign($("root").style, { width: W + "px", height: H + "px" });
          Object.assign(document.body.style, { width: W + "px", height: H + "px" });

          const dark = lum(cfg.bg) < 0.5;
          $("backdrop").style.background = cfg.backdrop === "glow"
            ? `radial-gradient(ellipse 60% 55% at 50% 48%, ${shade(cfg.bg, dark ? 0.16 : 0.35)} 0%, ${cfg.bg} 70%)`
            : cfg.bg;
          const bar = $("bar");
          Object.assign(bar.style, { display: geo.bh ? "flex" : "none", background: "#ececee", borderBottom: "1px solid #dcdce0" });
          [...bar.children].forEach((d, i) => { d.style.background = ["#ff5f57", "#febc2e", "#28c840"][i]; });
          const shot = $("shot");
          if (cfg.image && shot.getAttribute("src") !== cfg.image.url) shot.src = cfg.image.url;
          shot.style.visibility = cfg.image ? "visible" : "hidden"; // no image yet: hide Chrome's broken-image border
          // the drawing takes the backdrop's tone: light lines on dark, the stock greys on light
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.style.setProperty("--gen-surface", cfg.bg);
          if (gen) { gen.remove(); gen = null; }
          if (introLength()) {
            const now = time;
            seek(0); // the flat build pose, measured by the runtime
            time = now;
            gen = window.UIGeneration.build($("face"), buildMeasure(), {
              mode: cfg.intro, duration: BUILD_MS, code: cfg.layout.code, title: cfg.layout.title,
              done: `${cfg.layout.title} ready`,
            });
          }
          seek(time);
        }

        // The layout map (CSS px of the captured page) in the card's pixels, kept to the first screen:
        // under the browser bar, inside the viewport. Then the runtime's own limits: 60 parts (largest kept),
        // and 5 key elements, interactive ones first.
        function buildMeasure() {
          const { cw, ch, vh, bh } = geo, L = cfg.layout, s = cw / L.width;
          const parts = [];
          for (const p of L.parts) {
            const y = p.y * s;
            if (y >= vh - 4 || y + p.h * s <= 0) continue;
            const q = { ...p, x: p.x * s, y: y + bh, w: p.w * s, h: Math.min(p.h * s, vh - y), r: (p.r || 0) * s };
            if (p.lines) {
              q.lines = p.lines.filter((l) => (l.y + l.h) * s <= vh).map((l) => ({ x: l.x * s, x2: l.x2 * s, y: l.y * s + bh, h: l.h * s }));
              if (!q.lines.length) continue;
            }
            if (p.paths) q.paths = p.paths.map((g) => ({ ...g, m: [...g.m.slice(0, 5).map((v) => v * s), g.m[5] * s + bh] }));
            parts.push(q);
          }
          const keep = new Set([...parts].sort((a, b) => b.w * b.h - a.w * a.h).slice(0, 60));
          const kept = parts.filter((p) => keep.has(p)), boxes = kept.filter((p) => p.kind === "box");
          [...boxes.filter((b) => b.interactive), ...boxes.filter((b) => !b.interactive).sort((a, b) => b.w * b.h - a.w * a.h)].slice(0, 5).forEach((k) => (k.key = true));
          return { w: cw, h: ch, r: Math.min(cfg.radius * (cw / 1400), cw / 2, ch / 2), parts: kept };
        }

        // The zoom is applied by resizing the Screen (Z times every length), not by
        // a CSS scale, so Chrome always rasterises it at its on-screen size: a scaled
        // 3D layer is drawn at 1x and only re-rasterised once it stops moving.
        function seek(t) {
          time = t;
          if (!geo) return;
          const { W, H, cw, ch, vh, bh, left, top, ih, zoomTo: z } = geo;
          const st = stateAt(t), zoom = z ? st.zoom : 0;
          const Z = z ? lerp(1, z.Z, zoom) : 1;
          const px = z ? lerp(W / 2, z.cx, zoom) : W / 2, py = z ? lerp(H / 2, z.cy, zoom) : H / 2;
          const dark = lum(cfg.bg) < 0.5;
          Object.assign($("card").style, { left: W / 2 + Z * (left - px) - 2 + "px", top: H / 2 + Z * (top - py) - 2 + "px" });
          Object.assign($("face").style, {
            width: cw * Z + "px", height: ch * Z + "px",
            borderRadius: cfg.radius * (cw / 1400) * Z + "px",
            boxShadow: cfg.shadow ? shadow(cw * Z, dark, 1 - zoom) : "none", // fades out as the zoom fills the frame
          });
          const b = bh * Z;
          Object.assign($("bar").style, { height: b + "px", gap: b * 0.3 + "px", paddingLeft: b * 0.55 + "px" });
          [...$("bar").children].forEach((d) => Object.assign(d.style, { width: b * 0.36 + "px", height: b * 0.36 + "px" }));
          Object.assign($("viewport").style, { top: b + "px", height: vh * Z + "px" });
          Object.assign($("shot").style, { width: cw * Z + "px", height: ih * Z + "px", transform: `translateY(${-(st.scroll * Z).toFixed(2)}px)` });
          const tl = cfg.tilt * st.tilt;
          $("card").style.transform = tl ? `perspective(${W * 1.6 * Z}px) rotateX(${tl * 0.9}deg) rotateY(${-tl}deg) rotateZ(${tl * 0.12}deg)` : "none";
          if (gen) gen.seek(t * 1000);
        }

        function apply(next) { cfg = { ...DEFAULTS, ...cfg, ...next }; layout(); paint(); }

        // duration: the whole Loop, the build intro included
        window.quick = { apply, seek, get duration() { return cfg.duration + introLength(); }, get intro() { return introLength(); } };
        window.addEventListener("hf-seek", (e) => seek(e.detail.time));
        apply(window.__quickConfig || {});
      })();
    </script>
  </body>
</html>
