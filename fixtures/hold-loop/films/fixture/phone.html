<!DOCTYPE html>
<!-- Fixture Tour in a phone Device frame on the brand-colour Backdrop (Loop settings override the Project's): the Steel Hat phone move, a bold tilt easing upright while the page scrolls down to a card, then a push in on it. Focus path: whole → card-2. Primary Frame size: Landscape. -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1600, height=900">
    <title>Fixture: phone frame Tour</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="project-settings.js"></script>
    <script src="library/project-settings.js"></script>
    <script src="library/loop-model.js"></script>
    <script src="library/css-renderer.js"></script>
    <script src="library/shot.js"></script>
    <style>
      html, body { margin: 0; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-loop-shape="tour" data-composition-id="fixture-phone" data-settings="{&quot;deviceFrame&quot;:&quot;phone&quot;,&quot;backdrop&quot;:&quot;brand&quot;}" data-start="0" data-duration="6.5" data-width="1600" data-height="900">
      <div id="shot-1" class="clip" data-composition-id="scroll" data-composition-src="library/templates/scroll.html" data-start="0" data-duration="4.5" data-track-index="0" data-width="1600" data-height="900" data-variable-values="{&quot;screen&quot;:&quot;screens/fixture-mobile.png&quot;,&quot;screenWidth&quot;:1170,&quot;screenHeight&quot;:7800,&quot;from&quot;:&quot;whole&quot;,&quot;to&quot;:&quot;card-2&quot;,&quot;tilt&quot;:20}"></div>
      <div id="shot-2" class="clip" data-composition-id="hold" data-composition-src="library/templates/hold.html" data-start="4.5" data-duration="2" data-track-index="0" data-width="1600" data-height="900" data-variable-values="{&quot;screen&quot;:&quot;screens/fixture-mobile.png&quot;,&quot;screenWidth&quot;:1170,&quot;screenHeight&quot;:7800,&quot;focus&quot;:&quot;card-2&quot;,&quot;move&quot;:&quot;push-in&quot;}"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["fixture-phone"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
