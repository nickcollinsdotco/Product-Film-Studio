<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>PROTOTYPE: ticket 05 probe</title>
  </head>
  <body>
    <div data-hf-id="hf-wfn0" id="root" data-composition-id="probe" data-start="0" data-duration="2" data-width="800" data-height="600">
      <div data-hf-id="hf-x014" id="readout" style="position:absolute;left:40px;top:40px;font:28px/1.5 monospace;color:#fff;white-space:pre"></div>
      <div data-hf-id="hf-6pgg" id="bar" style="position:absolute;left:40px;top:500px;width:720px;height:40px;background:#4af;transform-origin:0 50%"></div>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          var root = document.getElementById("root");
          var host = root && root.parentElement;
          var a = root ? String(root.dataset.duration) : "no root";
          var b = host ? String(host.getAttribute("data-duration")) : "no host";
          var used = parseFloat((host && host.getAttribute("data-duration")) || (root && root.dataset.duration) || "2");
          document.getElementById("readout").textContent =
            "root.dataset.duration = " + a +
            "\nroot.parentElement data-duration = " + b +
            "\nbar fills over " + used + "s (host value)" +
            "\nscript ran at " + new Date().toISOString().slice(11, 19);
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: used, ease: "none" }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["probe"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
