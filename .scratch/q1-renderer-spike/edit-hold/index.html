<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Q1 hold test</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07090d; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="edit-hold" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <!-- Same Shot as b2-inline, but inner elements carry no clip timing; host clip extended to 7 s. -->
      <div id="shot-1" class="clip" data-composition-id="shot-b2-inline" data-composition-src="compositions/b2-inline-untimed.html" data-start="0" data-duration="7" data-track-index="0" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["edit-hold"] = tl;
    </script>
  </body>
</html>
